<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Quantum Visual IDE</title>
<style>
:root{
  --bg:#0e1116; --panel:#151a21; --card:#1b222c;
  --hover:#222b36; --text:#e6e8eb; --muted:#9aa4b2;
  --accent:#6ee7b7; --border:#2a3340;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Segoe UI,sans-serif}
header{padding:14px 20px;font-weight:600;border-bottom:1px solid var(--border)}
#layout{display:grid;grid-template-columns:240px 1fr 420px;height:calc(100vh - 52px)}
.panel{padding:14px;overflow:auto}
.left{background:var(--panel);border-right:1px solid var(--border)}
.right{background:var(--panel);border-left:1px solid var(--border)}

.block{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;margin:6px 0;position:relative}
.block:hover{background:var(--hover)}
.block-title{display:flex;align-items:center;gap:6px;font-weight:600}

.add{background:transparent;border:1px dashed var(--border);color:var(--muted);border-radius:6px;padding:2px 6px;cursor:pointer;position:relative;}
.add:hover{color:var(--text);border-color:var(--accent)}

.delete, .up, .down{background:transparent;border:none;font-weight:bold;cursor:pointer;margin-left:4px}
.delete{color:#f87171;}
.delete:hover{color:#ff4d4d;}
.up, .down{color:var(--accent);}
.up:hover, .down:hover{color:#34d399;}

.inner{margin-left:16px;padding-left:10px;border-left:1px dashed var(--border)}

input{background:#0c0f14;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:3px 6px;font-size:12px;width:90px}
input:focus{outline:none;border-color:var(--accent)}

pre{font-size:12px;color:#d1fae5;background:#0b0e13;border-radius:10px;padding:12px;border:1px solid var(--border);white-space:pre-wrap}

.menu{position:fixed;background:var(--card);border:1px solid var(--border);border-radius:8px;display:none;z-index:1000;min-width:160px;}
.menu div{padding:8px 12px;cursor:pointer;}
.menu div:hover{background:var(--hover)}

.tooltip{position:absolute;background:#1b222c;border:1px solid var(--border);padding:6px 8px;border-radius:6px;font-size:12px;color:var(--muted);white-space:pre-wrap;max-width:220px;z-index:1000;display:none;}
</style>
</head>
<body>
<header>⚛ Quantum Visual IDE</header>

<div id="layout">
  <div class="panel left">
    <div id="rootAdd" class="add">＋ Add block</div>
    <br>
    <button id="loadJSONBtn">📂 Load JSON</button>
    <input type="file" id="jsonFileInput" accept=".json" style="display:none;">
    <br><br>
    <button id="saveJSONBtn">💾 Save JSON</button>
    <br><br>
    <button id="saveQSharpBtn">💻 Save Q# Code</button>
  </div>

  <div class="panel" id="workspace"></div>

  <div class="panel right">
    <h3 style="margin-top:0;color:var(--muted)">Generated Q# Code</h3>
    <pre id="code"></pre>
  </div>
</div>

<div class="menu" id="addMenu"></div>
<div id="tooltip" class="tooltip"></div>

<script>
/* ===== BLOCK TYPES ===== */
const R = {
  namespace:{allowIn:["ROOT"],p:{name:"MyProgram"},c:1,
    code:(b,i)=>`${i}namespace ${b.p.name} {\n${b.c.map(x=>g(x,i+"    ")).join("")}${i}}\n`, help:"Namespace — Q# пространство имён"},

  open:{allowIn:["namespace"],p:{lib:"Microsoft.Quantum.Intrinsic"},c:0,
    code:(b,i)=>`${i}open ${b.p.lib};\n`, help:"Open — подключение библиотеки"},

  operation:{allowIn:["namespace"],p:{name:"Main",ret:"Unit",params:[]},c:1,
    code:(b,i)=>{
      const params=b.p.params.map(p=>`${p.name} : ${p.type}`).join(", ");
      return `${i}operation ${b.p.name}(${params}) : ${b.p.ret} {\n${b.c.map(x=>g(x,i+"    ")).join("")}${i}}\n`;
    }, help:"Operation — операция с кубитами"},

  function:{allowIn:["namespace"],p:{name:"Func",ret:"Int",params:[]},c:1,
    code:(b,i)=>{
      const params=b.p.params.map(p=>`${p.name} : ${p.type}`).join(", ");
      return `${i}function ${b.p.name}(${params}) : ${b.p.ret} {\n${b.c.map(x=>g(x,i+"    ")).join("")}${i}}\n`;
    }, help:"Function — возвращает значение"},

  if:{allowIn:["operation","function","if","for","while"],p:{cond:"true"},c:1,
    code:(b,i)=>`${i}if (${b.p.cond}) {\n${b.c.map(x=>g(x,i+"    ")).join("")}${i}}\n`, help:"If — условие"},

  for:{allowIn:["operation","function","if","for","while"],p:{v:"i",a:"0",b:"10"},c:1,
    code:(b,i)=>`${i}for (${b.p.v} in ${b.p.a}..${b.p.b}) {\n${b.c.map(x=>g(x,i+"    ")).join("")}${i}}\n`, help:"For — цикл"},

  while:{allowIn:["operation","function","if","for","while"],p:{cond:"true"},c:1,
    code:(b,i)=>`${i}while (${b.p.cond}) {\n${b.c.map(x=>g(x,i+"    ")).join("")}${i}}\n`, help:"While — цикл"},

  use:{allowIn:["operation"],p:{q:"q"},c:0,code:(b,i)=>`${i}use ${b.p.q} = Qubit();\n`, help:"Use — выделение кубита"},
  let:{allowIn:["operation","function"],p:{n:"x",v:"0"},c:0,code:(b,i)=>`${i}let ${b.p.n} = ${b.p.v};\n`, help:"Let — переменная"},
  return:{allowIn:["operation","function"],p:{v:"()"},c:0,code:(b,i)=>`${i}return ${b.p.v};\n`, help:"Return — возврат значения"},
  H:{allowIn:["operation","if","for","while"],p:{q:"q"},c:0,code:(b,i)=>`${i}H(${b.p.q});\n`, help:"Гейт Адамара"},
  X:{allowIn:["operation","if","for","while"],p:{q:"q"},c:0,code:(b,i)=>`${i}X(${b.p.q});\n`, help:"Гейт Паули X"},
  CNOT:{allowIn:["operation","if","for","while"],p:{c:"c",t:"t"},c:0,code:(b,i)=>`${i}CNOT(${b.p.c}, ${b.p.t});\n`, help:"Контролируемый X"},

  call:{allowIn:["operation","function","if","for","while"],p:{name:"Main",args:[]},c:0,
    code:(b,i)=>`${i}${b.p.name}(${b.p.args.join(", ")});\n`, help:"Call — вызов операции или функции"}
};

/* ===== CORE ===== */
let root=[];
const nb=t=>({id:crypto.randomUUID(),t,p:{...R[t].p},c:[]});
const g=(b,i="")=>R[b.t].code(b,i);

const workspace=document.getElementById("workspace");
const code=document.getElementById("code");
const addMenu=document.getElementById("addMenu");
const tooltip=document.getElementById("tooltip");

function init(){workspace.innerHTML="";root.forEach(b=>workspace.append(draw(b,"ROOT",root))); updateCode();}
function updateCode(){ code.textContent=root.map(b=>g(b,"")).join(""); }

function draw(b,parentType,parentArray){
 const d=document.createElement("div"); d.className="block";
 const title=document.createElement("div"); title.className="block-title"; title.textContent=b.t;

 if(R[b.t].c){
   const add=document.createElement("button"); add.className="add"; add.textContent="+";
   add.onmouseenter=e=>{tooltip.style.display="block"; tooltip.style.left=(e.clientX+10)+"px"; tooltip.style.top=(e.clientY+10)+"px"; tooltip.textContent=R[b.t].help;};
   add.onmouseleave=e=>{tooltip.style.display="none";};
   add.onclick=e=>{e.stopPropagation(); openAddMenu(e.clientX,e.clientY,b)}; title.append(add);
 }

 const up=document.createElement("button"); up.className="up"; up.textContent="↑"; up.onclick=e=>{e.stopPropagation(); moveBlock(b,parentArray,-1);}; title.append(up);
 const down=document.createElement("button"); down.className="down"; down.textContent="↓"; down.onclick=e=>{e.stopPropagation(); moveBlock(b,parentArray,1);}; title.append(down);
 const del=document.createElement("button"); del.className="delete"; del.textContent="×"; del.onclick=e=>{e.stopPropagation(); const arr=findParentArray(b,parentArray); const idx=arr.findIndex(x=>x.id===b.id); if(idx>=0) arr.splice(idx,1); init();}; title.append(del);

 d.append(title);

 // Обычные поля кроме params и args
 for(const k in b.p){
   if(k!=="params" && k!=="args"){
     const wrapper=document.createElement("div"); wrapper.style.marginTop="4px";
     const label=document.createElement("label"); label.textContent=k+": ";
     const inp=document.createElement("input"); inp.value=b.p[k]; inp.addEventListener("input",()=>{b.p[k]=inp.value; updateCode();});
     label.appendChild(inp); wrapper.appendChild(label); d.append(wrapper);
   }
 }

 // Параметры для operation/function
 if(b.t==="operation" || b.t==="function"){
   const paramsDiv=document.createElement("div"); paramsDiv.style.marginTop="4px";
   const paramsTitle=document.createElement("div"); paramsTitle.textContent="Parameters:"; paramsDiv.appendChild(paramsTitle);
   const listDiv=document.createElement("div"); listDiv.style.marginLeft="10px"; paramsDiv.appendChild(listDiv);

   function redrawParams(){
     listDiv.innerHTML="";
     b.p.params.forEach((p,idx)=>{
       const pDiv=document.createElement("div");
       const nameInp=document.createElement("input"); nameInp.value=p.name; nameInp.style.width="60px";
       nameInp.addEventListener("input",()=>{p.name=nameInp.value; updateCode();});
       const typeInp=document.createElement("input"); typeInp.value=p.type; typeInp.style.width="60px";
       typeInp.addEventListener("input",()=>{p.type=typeInp.value; updateCode();});
       const delBtn=document.createElement("button"); delBtn.textContent="×"; delBtn.className="delete";
       delBtn.onclick=()=>{b.p.params.splice(idx,1); redrawParams(); updateCode();};
       pDiv.append(nameInp,typeInp,delBtn);
       listDiv.appendChild(pDiv);
     });
   }
   redrawParams();
   const addParamBtn=document.createElement("button"); addParamBtn.textContent="+ Add Param"; addParamBtn.className="add";
   addParamBtn.onclick=()=>{b.p.params.push({name:"p",type:"Int"}); redrawParams(); updateCode();};
   paramsDiv.appendChild(addParamBtn);
   d.append(paramsDiv);
 }

 // Call block с одним Name
 if(b.t==="call"){
   const callDiv=document.createElement("div"); callDiv.style.marginTop="4px";

   // Поле Name
   const nameLabel=document.createElement("label"); nameLabel.textContent="Name: ";
   const nameInp=document.createElement("input"); nameInp.value=b.p.name; nameInp.style.width="120px";
   nameInp.addEventListener("input",()=>{b.p.name=b.value; updateCode();});
   nameLabel.appendChild(nameInp);
   callDiv.appendChild(nameLabel);

   // Аргументы
   const argsDiv=document.createElement("div"); argsDiv.style.marginTop="4px";
   const argsTitle=document.createElement("div"); argsTitle.textContent="Arguments:"; argsDiv.appendChild(argsTitle);
   const listDiv=document.createElement("div"); listDiv.style.marginLeft="10px"; argsDiv.appendChild(listDiv);

   function redrawArgs(){
     listDiv.innerHTML="";
     b.p.args.forEach((a,idx)=>{
       const aDiv=document.createElement("div");
       const inp=document.createElement("input"); inp.value=a; inp.style.width="100px";
       inp.addEventListener("input",()=>{b.p.args[idx]=inp.value; updateCode();});
       const delBtn=document.createElement("button"); delBtn.textContent="×"; delBtn.className="delete";
       delBtn.onclick=()=>{b.p.args.splice(idx,1); redrawArgs(); updateCode();};
       aDiv.append(inp,delBtn); listDiv.appendChild(aDiv);
     });
   }
   redrawArgs();

   const addArgBtn=document.createElement("button"); addArgBtn.textContent="+ Add Arg"; addArgBtn.className="add";
   addArgBtn.onclick=()=>{b.p.args.push("arg"); redrawArgs(); updateCode();};
   argsDiv.appendChild(addArgBtn);

   callDiv.appendChild(argsDiv);
   d.append(callDiv);
 }

 if(b.c.length){const iDiv=document.createElement("div"); iDiv.className="inner"; b.c.forEach(x=>iDiv.append(draw(x,b.t,b.c))); d.append(iDiv);}
 return d;
}

function moveBlock(block,array,dir){const idx=array.findIndex(x=>x.id===block.id); const newIdx=idx+dir; if(newIdx<0||newIdx>=array.length) return; [array[idx],array[newIdx]]=[array[newIdx],array[idx]]; init();}
function findParentArray(target,array){if(array.includes(target)) return array; for(const b of array){const res=findParentArray(target,b.c); if(res) return res;} return null;}

/* ===== ADD MENU ===== */
function openAddMenu(x,y,parent){
  addMenu.innerHTML="";
  const parentType=parent?parent.t:"ROOT";
  Object.keys(R).forEach(t=>{ if(R[t].allowIn.includes(parentType)){
    const item=document.createElement("div"); item.textContent=t;
    item.onmouseenter=e=>{ tooltip.style.display="block"; tooltip.style.left=(e.clientX+10)+"px"; tooltip.style.top=(e.clientY+10)+"px"; tooltip.textContent=R[t].help;};
    item.onmouseleave=e=>{tooltip.style.display="none";};
    item.onclick=e=>{e.stopPropagation(); parent?parent.c.push(nb(t)):root.push(nb(t)); addMenu.style.display="none"; init(); };
    addMenu.append(item);
  }});
  addMenu.style.left=x+"px"; addMenu.style.top=y+"px"; addMenu.style.display="block";
}

document.getElementById("rootAdd").onclick=e=>{ e.stopPropagation(); openAddMenu(e.clientX,e.clientY,null); };
document.body.addEventListener("click",()=>{addMenu.style.display="none"; tooltip.style.display="none";});
addMenu.addEventListener("click",e=>e.stopPropagation());

/* ===== JSON LOAD/SAVE ===== */
document.getElementById("loadJSONBtn").onclick=()=>document.getElementById("jsonFileInput").click();
document.getElementById("jsonFileInput").onchange=e=>{
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{ root=JSON.parse(e.target.result); init(); }catch(err){alert("Ошибка JSON");}
  }
  reader.readAsText(file);
};
document.getElementById("saveJSONBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(root,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="blocks.json"; a.click(); URL.revokeObjectURL(url);
};

/* ===== SAVE Q# CODE ===== */
document.getElementById("saveQSharpBtn").onclick=()=>{
  const qcode=root.map(b=>g(b,"")).join("");
  const blob=new Blob([qcode],{type:"text/plain"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download="program.qs"; a.click(); URL.revokeObjectURL(url);
};

init();
</script>
</body>
</html>
